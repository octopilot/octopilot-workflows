name: "Lint (Octopilot)"

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use for pre-commit."
                required: false
                type: string
                default: "3.12"
            extra-args:
                description: "Additional arguments for pre-commit run."
                required: false
                type: string
                default: "--all-files"
            skip-checks:
                description: "Comma-separated list of pre-commit hooks to skip (SKIP env var)."
                required: false
                type: string
                default: ""

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install pre-commit
              run: pip install pre-commit

            - name: Cache pre-commit
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
                  restore-keys: |
                      pre-commit-${{ runner.os }}-

            - name: Run pre-commit
              env:
                  SKIP: ${{ inputs.skip-checks }}
              run: pre-commit run ${{ inputs.extra-args }}
