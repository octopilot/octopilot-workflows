name: "Lint (Octopilot)"

on:
    workflow_call:
        inputs:
            pipeline-context:
                description: "Consolidated CI context object (JSON)"
                required: false
                type: string
                default: "{}"

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ inputs.python-version }}

            # --- Multi-language Setup ---

            - name: Setup Go
              if: contains(fromJson(inputs.pipeline-context).languages, 'go') || contains(inputs.languages, 'go')
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ fromJson(inputs.pipeline-context).versions.go || inputs.go-version }}

            - name: Setup Rust
              if: contains(fromJson(inputs.pipeline-context).languages, 'rust') || contains(inputs.languages, 'rust')
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ fromJson(inputs.pipeline-context).versions.rust || inputs.rust-version }}
                  components: rustfmt, clippy

            - name: Setup Node
              if: contains(fromJson(inputs.pipeline-context).languages, 'node') || contains(inputs.languages, 'node')
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ fromJson(inputs.pipeline-context).versions.node || inputs.node-version }}

            - uses: actions/setup-python@v5
              if: contains(fromJson(inputs.pipeline-context).languages, 'python') || contains(inputs.languages, 'python')
              with:
                  python-version: ${{ fromJson(inputs.pipeline-context).versions.python || inputs.python-version }}

            - uses: actions/setup-java@v4
              if: contains(fromJson(inputs.pipeline-context).languages, 'java') || contains(inputs.languages, 'java')
              with:
                  distribution: "temurin"
                  java-version: ${{ fromJson(inputs.pipeline-context).versions.java || inputs.java-version }}

            - name: Install pre-commit
              run: pip install pre-commit

            - name: Cache pre-commit
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
                  restore-keys: |
                      pre-commit-${{ runner.os }}-

            - name: Run pre-commit
              env:
                  SKIP: ${{ inputs.skip-checks }}
              run: pre-commit run ${{ inputs.extra-args }}
