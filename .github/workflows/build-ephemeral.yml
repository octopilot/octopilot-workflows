name: "Build Ephemeral (Octopilot)"

on:
    workflow_call:
        inputs:
            ttl:
                description: "Time to live for the image (e.g. 2h, 1d)."
                required: false
                type: string
                default: "2h"
            op_version:
                description: "Version of octopilot-pipeline-tools to use."
                required: false
                type: string
                default: "latest"
            platform:
                description: "Platforms to build for (e.g. linux/amd64)."
                required: false
                type: string
                default: "linux/amd64"
        outputs:
            image_ref:
                description: "The full reference to the pushed ephemeral image."
                value: ${{ jobs.build.outputs.image_ref }}

jobs:
    build:
        name: Build Ephemeral
        runs-on: ubuntu-latest
        outputs:
            image_ref: ${{ steps.output.outputs.image_ref }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Build and Push to ttl.sh
              id: build
              uses: octopilot/actions/build-ephemeral@main
              with:
                  ttl: ${{ inputs.ttl }}
                  op_version: ${{ inputs.op_version }}
                  platform: ${{ inputs.platform }}

            - name: Set Output
              id: output
              run: echo "image_ref=${{ steps.build.outputs.image_ref }}" >> $GITHUB_OUTPUT
