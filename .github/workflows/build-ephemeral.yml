name: "Build Ephemeral (Octopilot)"

on:
    workflow_call:
        inputs:
            ttl:
                description: "Time to live for the image (e.g. 2h, 1d)."
                required: false
                type: string
                default: "2h"
            op_version:
                description: "Version of octopilot-pipeline-tools to use."
                required: false
                type: string
                default: "latest"
            platform:
                description: "Platforms to build for (e.g. linux/amd64)."
                required: false
                type: string
                default: "linux/amd64"
        outputs:
            image_ref:
                description: "The full reference to the pushed ephemeral image."
                value: ${{ jobs.build.outputs.image_ref }}

jobs:
    build:
        name: Build Ephemeral
        runs-on: ubuntu-latest
        outputs:
            image_ref: ${{ steps.output.outputs.image_ref }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            # Note: Duplicating open installation logic to avoid dependency on composite action for now
            - name: Install Octopilot Pipeline Tools (op)
              run: |
                  OP_VERSION="${{ inputs.op_version }}"
                  if [ "$OP_VERSION" == "latest" ]; then
                     OP_VERSION=$(curl -s https://api.github.com/repos/octopilot/octopilot-pipeline-tools/releases/latest | jq -r .tag_name)
                  fi

                  echo "Installing op version: $OP_VERSION"

                  ARCH="amd64"
                  if [ "$(uname -m)" == "aarch64" ]; then
                    ARCH="arm64"
                  fi
                  OS="linux"

                  URL="https://github.com/octopilot/octopilot-pipeline-tools/releases/download/${OP_VERSION}/op-${OS}-${ARCH}"
                  curl -L -o op "$URL"
                  chmod +x op
                  sudo mv op /usr/local/bin/op

            - name: Build and Push to ttl.sh
              id: build
              run: |
                  # Construct ephemeral tag
                  # ttl.sh supports standard image names: ttl.sh/user/repo:tag
                  # We use a UUID or SHA to avoid collisions, plus the TTL suffix

                  SHORT_SHA=$(git rev-parse --short HEAD)
                  TTL="${{ inputs.ttl }}"

                  # Image Name: ttl.sh/<owner>/<repo>:<ttl>
                  # But ttl.sh has a limit on image name length/structure sometimes, 
                  # safest is ttl.sh/<uuid>:<time>
                  # However, preserving repo name is nice for debugging.
                  # ttl.sh docs: ttl.sh/<image_name>:<valid_time>

                  REPO_NAME="${{ github.event.repository.name }}"
                  OWNER="${{ github.repository_owner }}"

                  # Note: ttl.sh creates a unique repository for each image name.
                  # We will use: ttl.sh/<owner>-<repo>-<short_sha>
                  # Tag: <ttl>

                  IMAGE_NAME="ttl.sh/${OWNER}-${REPO_NAME}-${SHORT_SHA}"
                  TAG="${TTL}"

                  FULL_REF="${IMAGE_NAME}:${TAG}"

                  echo "Building ephemeral image: $FULL_REF"

                  # We need to tell `op` (skaffold) to push to this repo.
                  # `op build --repo <...>` replaces the configured registry.
                  # But `op` / `skaffold` usually appends the tag.
                  # If we say --repo ttl.sh/my-image, it might try to push ttl.sh/my-image:latest
                  # 
                  # TRICK: We use the DOCKER_METADATA_OUTPUT_VERSION env var we added to `op`.
                  # If we set it to the TTL (e.g. "2h"), `op` will tag as `:2h`.

                  export DOCKER_METADATA_OUTPUT_VERSION="${TAG}"

                  # We pass the "repo" part to --repo
                  op build --repo "${IMAGE_NAME}" --platform "${{ inputs.platform }}" --push

                  # Output the full ref
                  # The `op` command will produce :latest AND :<version> (which is :2h here)
                  # We want the consumer to use the :<version> one.

                  # Wait... `op build` logic appends version to latest?
                  # Logic: `versionTagStr := strings.TrimSuffix(fullTag, "latest") + version`
                  # If fullTag is `ttl.sh/foo:latest`, version is `2h` -> `ttl.sh/foo:2h`. Correct.

                  echo "image_ref=${FULL_REF}" >> $GITHUB_OUTPUT

            - name: Set Output
              id: output
              run: echo "image_ref=${{ steps.build.outputs.image_ref }}" >> $GITHUB_OUTPUT
