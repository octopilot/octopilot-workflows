name: Reusable Release Workflow
# ──────────────────────────────────────────────────────────────────────────────
# Prerequisites
# ──────────────────────────────────────────────────────────────────────────────
# repo_token  — Pass secrets.REPO_PAT (org-level Personal Access Token).
#               Requires the `contents: write` scope on the target repo.
#
#               WHY A PAT IS REQUIRED:
#               GITHUB_TOKEN cannot push commits back to the repo in a way that
#               triggers downstream CI workflows (e.g. the `ci.yml` build that
#               creates the container images). GitHub blocks this to prevent
#               infinite loops. A PAT-authored push DOES trigger CI normally.
#
#               The octopilot org has REPO_PAT configured as an org-level secret.
#               Pass it in the calling workflow:
#
#                 secrets:
#                   repo_token: ${{ secrets.REPO_PAT }}
# ──────────────────────────────────────────────────────────────────────────────

on:
    workflow_call:
        inputs:
            mode:
                description: "Language mode (go, rust, maven, gradle, node, python, dotnet, text)"
                required: true
                type: string
            bump:
                description: "Bump type (major, minor, patch)"
                required: true
                type: string
                default: "patch"
            file:
                description: "Path to version file (optional)"
                required: false
                type: string
            trailer:
                description: >
                    Optional trailer line(s) appended to the release commit message, e.g. "Release-Feeds: a b". They
                    travel with the tag, so a tag-triggered build can read choices made when the release was cut.
                required: false
                type: string
                default: ""
            runner:
                description: >
                    Runner for the release job: a label (default "ubuntu-latest") or a JSON array string for a
                    self-hosted label set, e.g. '["self-hosted", "linux", "x64", "microscaler"]'.
                required: false
                type: string
                default: "ubuntu-latest"
        secrets:
            repo_token:
                description: "PAT with contents:write — use secrets.REPO_PAT (see comment above)"
                required: true

jobs:
    release:
        runs-on: ${{ (startsWith(inputs.runner, '[') && fromJSON(inputs.runner)) || inputs.runner }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.repo_token }}
                  fetch-depth: 0

            - name: Bump Version
              id: bump
              uses: octopilot/actions/bump-version@main
              with:
                  mode: ${{ inputs.mode }}
                  bump: ${{ inputs.bump }}
                  file: ${{ inputs.file }}

            - name: Release commit message
              id: msg
              shell: bash
              env:
                  VERSION: ${{ steps.bump.outputs.version }}
                  TRAILER: ${{ inputs.trailer }}
              run: |
                  set -euo pipefail
                  {
                    echo "message<<__MSG__"
                    echo "chore(release): bump version to v${VERSION}"
                    if [ -n "${TRAILER}" ]; then echo; printf '%s\n' "${TRAILER}"; fi
                    echo "__MSG__"
                  } >> "$GITHUB_OUTPUT"

            - name: Commit, Tag, and Push
              uses: EndBug/add-and-commit@v9
              with:
                  add: "." # Add all changes (the bumped file)
                  message: ${{ steps.msg.outputs.message }}
                  tag: "v${{ steps.bump.outputs.version }}"
                  author_name: "github-actions[bot]"
                  author_email: "github-actions[bot]@users.noreply.github.com"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: "v${{ steps.bump.outputs.version }}"
                  generate_release_notes: true
                  token: ${{ secrets.repo_token }}
