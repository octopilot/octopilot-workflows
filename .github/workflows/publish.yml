name: "Publish (Octopilot)"

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3). Defaults to tag name."
        required: false
        type: string
        default: ""
      registry:
        description: "Container registry to push to (e.g. ghcr.io). Repository owner will be appended."
        required: false
        type: string
        default: "ghcr.io"
      platforms:
        description: "Comma-separated list of platforms to build for (e.g. linux/amd64,linux/arm64)."
        required: false
        type: string
        default: "linux/amd64"
      op_version:
        description: "Version of octopilot-pipeline-tools to use (e.g. v0.1.18 or latest)."
        required: false
        type: string
        default: "latest"
      upload_artifacts:
        description: "Glob pattern of files to upload to the release."
        required: false
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build
        uses: octopilot/actions/octopilot@main
        with:
          version: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          registry: ${{ inputs.registry }}/${{ github.repository_owner }}
          platforms: ${{ inputs.platforms }}
          op_version: ${{ inputs.op_version }}
          sbom_output: dist/sbom

      - name: Attest Build Provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ inputs.registry }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Find Previous Tag
        id: prev_tag
        uses: octopilot/actions/previous-tag@main
        with:
          fallback: "v0.0.0"

      - name: Generate Release Notes
        id: release_notes
        uses: octopilot/actions/release@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          since_tag: ${{ steps.prev_tag.outputs.tag }}
          provider: anthropic

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          files: |
            dist/sbom.tar.gz
            ${{ inputs.upload_artifacts }}
