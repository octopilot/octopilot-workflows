name: "Publish (Octopilot)"

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3). Defaults to tag name."
        required: false
        type: string
        default: ""
      registry:
        description: "Container registry to push to (e.g. ghcr.io). Repository owner will be appended."
        required: false
        type: string
        default: "ghcr.io"
      platforms:
        description: "Comma-separated list of platforms to build for (e.g. linux/amd64,linux/arm64)."
        required: false
        type: string
        default: "linux/amd64"
      op_version:
        description: "Version of octopilot-pipeline-tools to use (e.g. v0.1.18 or latest)."
        required: false
        type: string
        default: "latest"
      upload_artifacts:
        description: "Glob pattern of files to upload to the release."
        required: false
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Octopilot Pipeline Tools (op)
        run: |
          OP_VERSION="${{ inputs.op_version }}"
          if [ "$OP_VERSION" == "latest" ]; then
             # Fetch latest release tag from GitHub API
             OP_VERSION=$(curl -s https://api.github.com/repos/octopilot/octopilot-pipeline-tools/releases/latest | jq -r .tag_name)
          fi

          echo "Installing op version: $OP_VERSION"

          # Detect runner architecture
          ARCH="amd64"
          if [ "$(uname -m)" == "aarch64" ]; then
            ARCH="arm64"
          fi
          OS="linux"

          URL="https://github.com/octopilot/octopilot-pipeline-tools/releases/download/${OP_VERSION}/op-${OS}-${ARCH}"
          echo "Downloading from $URL"

          curl -L -o op "$URL"
          chmod +x op
          sudo mv op /usr/local/bin/op

          op --version

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build
        run: |
          # Determine version
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi

          # Pass version to build via env var (for tagging logic)
          export DOCKER_METADATA_OUTPUT_VERSION="$VERSION"

          # Construct repo URL (e.g. ghcr.io/owner)
          REPO="${{ inputs.registry }}/${{ github.repository_owner }}"

          echo "Building for platforms: ${{ inputs.platforms }}"
          echo "Pushing to: $REPO"

          # Run op build
          # Sbom output dir
          mkdir -p dist/sbom

          op build --repo "$REPO" --platform "${{ inputs.platforms }}" --push --sbom-output dist/sbom

          # Package SBOMs
          if [ -d "dist/sbom" ] && [ "$(ls -A dist/sbom)" ]; then
            tar -czvf dist/sbom.tar.gz -C dist/sbom .
          fi

          # Extract digest for attestation
          if [ -f "build_result.json" ]; then
            TAG=$(jq -r '.builds[0].tag' build_result.json)
            DIGEST=$(echo "$TAG" | awk -F'@' '{print $2}')
            echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          fi

      - name: Attest Build Provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ inputs.registry }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Find Previous Tag
        id: prev_tag
        uses: octopilot/actions/previous-tag@main
        with:
          fallback: "v0.0.0"

      - name: Generate Release Notes
        id: release_notes
        uses: octopilot/actions/release@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          since_tag: ${{ steps.prev_tag.outputs.tag }}
          provider: anthropic

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          files: |
            dist/sbom.tar.gz
            ${{ inputs.upload_artifacts }}
